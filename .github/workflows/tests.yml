name: Offline data-quality tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate notebook JSON
        run: python -c "import json,pathlib; j=json.loads(pathlib.Path('notebooks/01_bronze_silver_gold.ipynb').read_text()); assert j['cells']"
      # pytest-based tests need pyspark + Java; they are added to CI in TODO-15 (docs/TODO.md#todo-15)
      - name: Run offline parser tests
        run: python -m unittest discover -s tests -p "test_core.py" -v
